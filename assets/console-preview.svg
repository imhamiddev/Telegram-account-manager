<svg xmlns="http://www.w3.org/2000/svg" width="380" height="640" viewBox="0 0 380 640" role="img" aria-label="Mini App console preview">
  <defs>
    <clipPath id="screen"><rect x="18" y="18" width="344" height="604" rx="30"/></clipPath>
  </defs>

  <!-- phone -->
  <rect x="4" y="4" width="372" height="632" rx="42" fill="#0a0a0f" stroke="#2a2a3a" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="18" y="18" width="344" height="604" fill="#09090b"/>

    <!-- top bar -->
    <text x="38" y="62" font-family="Inter,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#fafafa">Backup Console</text>
    <text x="38" y="80" font-family="Inter,'Segoe UI',sans-serif" font-size="11" fill="#a1a1aa">Settings</text>
    <line x1="18" y1="96" x2="362" y2="96" stroke="#27272a"/>

    <!-- Appearance card -->
    <rect x="34" y="112" width="312" height="118" rx="14" fill="#09090b" stroke="#27272a"/>
    <text x="50" y="138" font-family="Inter,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fafafa">Appearance</text>
    <g font-family="Inter,'Segoe UI',sans-serif" font-size="10" fill="#a1a1aa" text-anchor="middle">
      <rect x="50"  y="150" width="84" height="30" rx="8" fill="none" stroke="#27272a"/><text x="92"  y="169">System</text>
      <rect x="143" y="150" width="84" height="30" rx="8" fill="none" stroke="#27272a"/><text x="185" y="169">Light</text>
      <rect x="236" y="150" width="84" height="30" rx="8" fill="none" stroke-width="1.5">
        <animate attributeName="stroke" values="#ef4444;#16a34a;#eab308;#9333ea;#ec4899;#2563eb;#f97316;#ef4444" dur="14s" repeatCount="indefinite"/>
      </rect>
      <text x="278" y="169" fill="#fafafa">Dark</text>
    </g>
    <!-- accent dots -->
    <g>
      <circle cx="62"  cy="206" r="9" fill="#ef4444"/>
      <circle cx="94"  cy="206" r="9" fill="#16a34a"/>
      <circle cx="126" cy="206" r="9" fill="#eab308"/>
      <circle cx="158" cy="206" r="9" fill="#9333ea"/>
      <circle cx="190" cy="206" r="9" fill="#ec4899"/>
      <circle cx="222" cy="206" r="9" fill="#2563eb"/>
      <circle cx="254" cy="206" r="9" fill="#f97316"/>
      <!-- selection ring hops between swatches -->
      <circle r="13" fill="none" stroke="#fafafa" stroke-width="2" cy="206">
        <animate attributeName="cx" values="62;94;126;158;190;222;254;62" keyTimes="0;.143;.286;.429;.571;.714;.857;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Backup card with switches -->
    <rect x="34" y="246" width="312" height="190" rx="14" fill="#09090b" stroke="#27272a"/>
    <text x="50" y="272" font-family="Inter,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fafafa">Backup</text>

    <g font-family="Inter,'Segoe UI',sans-serif" font-size="12" fill="#fafafa">
      <text x="50" y="304">Forward messages</text>
      <text x="50" y="344">Topic per sender</text>
      <text x="50" y="384">Close DM (auto-delete)</text>
      <text x="50" y="400" font-size="9.5" fill="#a1a1aa">Deletes incoming private messages</text>
    </g>
    <line x1="50" y1="316" x2="330" y2="316" stroke="#27272a"/>
    <line x1="50" y1="356" x2="330" y2="356" stroke="#27272a"/>

    <!-- switch 1: on -->
    <rect x="290" y="291" width="40" height="22" rx="11">
      <animate attributeName="fill" values="#ef4444;#16a34a;#eab308;#9333ea;#ec4899;#2563eb;#f97316;#ef4444" dur="14s" repeatCount="indefinite"/>
    </rect>
    <circle cx="319" cy="302" r="8" fill="#09090b"/>
    <!-- switch 2: off -->
    <rect x="290" y="331" width="40" height="22" rx="11" fill="#27272a"/>
    <circle cx="301" cy="342" r="8" fill="#fafafa"/>
    <!-- switch 3: animated toggle -->
    <rect x="290" y="371" width="40" height="22" rx="11">
      <animate attributeName="fill" values="#27272a;#27272a;#ef4444;#16a34a;#eab308;#9333ea;#ec4899;#2563eb;#f97316;#f97316;#27272a" keyTimes="0;.08;.1;.2;.3;.4;.5;.6;.7;.9;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <circle cy="382" r="8" fill="#fafafa">
      <animate attributeName="cx" values="301;301;319;319;301" keyTimes="0;.08;.1;.9;1" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Primary button -->
    <rect x="34" y="456" width="312" height="38" rx="9">
      <animate attributeName="fill" values="#ef4444;#16a34a;#eab308;#9333ea;#ec4899;#2563eb;#f97316;#ef4444" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="190" y="480" text-anchor="middle" font-family="Inter,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#fff">Manage auto-replies</text>

    <!-- bottom nav -->
    <rect x="18" y="560" width="344" height="62" fill="#09090b"/>
    <line x1="18" y1="560" x2="362" y2="560" stroke="#27272a"/>
    <g font-family="Inter,'Segoe UI',sans-serif" font-size="10" text-anchor="middle" fill="#a1a1aa">
      <text x="75"  y="602">Overview</text>
      <text x="147" y="602">Chats</text>
      <text x="219" y="602">Account</text>
      <text x="291" y="602">Settings
        <animate attributeName="fill" values="#ef4444;#16a34a;#eab308;#9333ea;#ec4899;#2563eb;#f97316;#ef4444" dur="14s" repeatCount="indefinite"/>
      </text>
    </g>
    <g fill="#a1a1aa">
      <circle cx="75" cy="580" r="5"/><circle cx="147" cy="580" r="5"/><circle cx="219" cy="580" r="5"/>
      <circle cx="291" cy="580" r="5">
        <animate attributeName="fill" values="#ef4444;#16a34a;#eab308;#9333ea;#ec4899;#2563eb;#f97316;#ef4444" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <!-- notch -->
  <rect x="140" y="26" width="100" height="22" rx="11" fill="#000"/>
</svg>
